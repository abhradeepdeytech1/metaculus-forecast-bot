name: Initialize private bot state

on:
  workflow_dispatch:

concurrency:
  group: metaculus-bot-ledger
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Create state branch only if it does not exist
        shell: bash
        run: |
          set -euo pipefail
          existing="$(git ls-remote origin refs/heads/bot-state)"
          if [[ -n "$existing" ]]; then
            echo "The bot-state branch already exists. Refusing to replace it."
            exit 1
          fi
          git checkout --orphan bot-state-initialize
          git rm -rf .
          printf '{"version":1,"questions":{},"calls":{}}\n' > ledger.json
          git add ledger.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Initialize bot state ledger'
          git push origin HEAD:refs/heads/bot-state

